# This repository's own backlog predates the .tasks default, so pin it.
tasks_dir: tasks
task_types:
  - feature
  - bug
auto_archive:
  enabled: true
  after_days: 30
web:
  enabled: false
  addr: 127.0.0.1:7777
  # Status colours, one palette for card dots and borders, the in-progress
  # chip, the Done bars and the graph. Names are <hue>-<shade> from a fixed
  # list (hues neutral red orange amber lime emerald teal sky blue violet
  # fuchsia rose; shades 200 300 400 500). Omitted roles keep these defaults.
  # colors:
  #   todo: neutral-500
  #   in_progress: amber-400
  #   done: emerald-500
  #   recent: emerald-200   # closed inside recent_hours: bar highlight, Done card frame
  #   new: sky-400          # created inside new_hours, still todo
  # new_hours: 24           # window of the `new` chip on todo cards; default for bars cards
  # recent_hours: 24        # the one "recently closed" window: the bars' highlight and the Done list
  # Statistics cards of the board's Done column, in board order. These four
  # are the defaults; `cards: []` shows none.
  done_stats:
    cards:
      - kind: bars
        field: priority
      - kind: bars
        field: type
      - kind: bars
        field: resolution
      - kind: lines
        days: 14
        lines: [created, closed]
      # One line per priority, closures per day over 30 days:
      # - kind: lines
      #   days: 30
      #   split_by: priority
      #   metric: closed
# Git branch per task. The server never commits tasks/ (it is excluded from
# its snapshots), so this repository keeps committing it by hand. Tasks
# started before this was enabled have no branch and stay record-only.
git:
  branching: true
  base_branches: [main_patched, master_patched, main, master]
