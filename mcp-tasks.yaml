# This repository's own backlog predates the .tasks default, so pin it.
tasks_dir: tasks
task_types:
  - feature
  - bug
auto_archive:
  enabled: true
  after_days: 30
web:
  enabled: false
  addr: 127.0.0.1:7777
# Git branch per task. Left off here: this repository commits its own tasks/
# directory and its tasks predate the feature. Reference values:
# git:
#   branching: false
#   base_branches: [main_patched, master_patched, main, master]
