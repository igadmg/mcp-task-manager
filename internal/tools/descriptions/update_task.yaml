description: |
  Update an existing task. When git branching is enabled, status moves that
  would bypass the branch work are refused: use start_task to start or
  resume a task, and complete_task to close one that works on a branch.
  Reopening to todo is allowed; the branch is kept, and the next start_task
  resumes on it. It never touches phase records: a run left open by closing
  a task here can still be finished with finish_phase.
params:
  id: Task ID
  title: New title
  description: New description
  status: New status
  priority: New priority
  type: New task type.
  resolution: |
    Close the task with this resolution (completed, obsolete, superseded,
    duplicate, wontfix). Setting it moves the task to done; moving a task out
    of done clears it again.
  resolution_note: One line on why the task was closed this way; only valid for a done task.
  verified: |
    true stamps verified_at with now - a record that this task's own text was
    just checked against the code and still describes reality. It says nothing
    about progress; use it when reviewing a backlog for staleness. false clears
    the stamp.
  fields: |
    Free-form metadata to merge into the task, one object of key: value
    pairs. A key given is set, a key left out is untouched, and a value of
    null or "" removes its key - so a field cannot hold an empty string.
    Same key rules and scalar values as create_task; a bad key or value
    fails the whole call and changes nothing.
