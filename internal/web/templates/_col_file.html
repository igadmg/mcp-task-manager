{{/* A file column: the name, a link to the raw bytes, and the file itself in
     the working area - rendered as a document when its name says so,
     otherwise as preformatted text (_body.html). */}}
<div class="col-head">
  <span class="meta truncate" title="{{ .Name }}">{{ .Name }}</span>
  <a class="copy-btn ml-auto" href="{{ nav .RawHref }}" target="_blank" rel="noopener">raw</a>
</div>
{{ template "_body.html" .Body }}
