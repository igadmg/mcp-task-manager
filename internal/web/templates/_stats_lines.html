<section class="stats-card" data-stats-card="{{ .ID }}">
  <h3 class="text-[11px] font-medium uppercase tracking-wider text-neutral-400">{{ .Title }}</h3>
  {{ with .Chart }}
  <ul class="stats-legend">
    {{ range .Legend }}
    <li class="flex min-w-0"><button type="button" class="stats-legend-item" data-stats-line="{{ .Key }}" aria-pressed="{{ not .Hidden }}" title="{{ .Key }}"><span class="stats-swatch {{ .Color }}"></span><span class="truncate">{{ .Key }}</span></button></li>
    {{ end }}
  </ul>
  <svg class="stats-chart" viewBox="0 0 {{ .Width }} 1" preserveAspectRatio="none" role="img"
       aria-label="{{ $.Title }}, {{ .First }} to {{ .Last }}">
    {{ range .Groups }}
    <svg viewBox="0 0 {{ .Width }} {{ .Max }}" preserveAspectRatio="none" width="100%" height="100%">
      {{ range .Lines }}<polyline class="stats-line {{ .Color }}{{ if .Hidden }} stats-off{{ end }}" data-stats-line="{{ .Key }}" points="{{ .Points }}"/>{{ end }}
    </svg>
    {{ end }}
    {{ range .Days }}<rect class="stats-day" x="{{ .X }}" width="2" height="1"><title>{{ .Title }}</title></rect>{{ end }}
  </svg>
  <div class="meta mt-1 flex justify-between gap-2">
    <span>{{ .First }}</span>
    <span>{{ .Last }}</span>
  </div>
  <p class="meta truncate text-center">{{ range $i, $g := .Groups }}{{ if $i }} &middot; {{ end }}{{ if .Cumulative }}{{ .Peak }} total{{ else }}{{ .Peak }}/day{{ end }}{{ end }}</p>
  {{ else }}
  <p class="meta mt-2">no data</p>
  {{ end }}
</section>
