<!doctype html>
<html lang="en" class="h-full bg-neutral-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}Task board{{ end }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="min-h-full bg-neutral-950 font-sans text-neutral-200 antialiased">
  <header class="sticky top-0 z-10 border-b border-white/5 bg-neutral-950/85 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] flex-wrap items-baseline gap-x-4 gap-y-1 px-4 py-3">
      <a href="/" class="text-sm font-semibold tracking-tight text-neutral-100">Task board</a>
      <span class="meta truncate">{{ .Project.TasksDir }}</span>
      <span class="ml-auto meta">read-only &middot; {{ .Project.TaskCount }} tasks</span>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] px-4 py-5">
    {{ block "content" . }}{{ end }}
  </main>
</body>
</html>
