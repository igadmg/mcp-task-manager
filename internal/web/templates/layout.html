<!doctype html>
<html lang="en" class="h-full bg-neutral-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}Task board{{ end }}</title>
  <link rel="stylesheet" href="{{ asset "app.css" }}">
  <script src="{{ asset "htmx.min.js" }}" defer></script>
  <script src="{{ asset "app.js" }}" defer></script>
</head>
<body class="min-h-full bg-neutral-950 font-sans text-neutral-200 antialiased">
  <header class="sticky top-0 z-10 border-b border-white/5 bg-neutral-950/85 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] flex-wrap items-baseline gap-x-4 gap-y-1 px-4 py-3">
      <a href="{{ nav "/" }}" class="text-sm font-semibold tracking-tight text-neutral-100">Task board</a>
      {{ if .Project.TasksDir }}<span class="meta truncate">{{ .Project.TasksDir }}</span>{{ end }}
      <span class="ml-auto meta">
        {{ if .Project.TasksDir }}read-only &middot; {{ .Project.TaskCount }} tasks &middot; {{ end }}
        <!-- / is a global route, not a session one: it is the one page every
             session can link without a token. -->
        <a class="hover:text-neutral-300" href="/">workspaces</a>
      </span>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] px-4 py-5">
    {{ block "content" . }}{{ end }}
  </main>
</body>
</html>
